name: CI
# Every push to zerospadesx and every pull request into it builds every platform
# and runs the tests; nothing is published. release.yml calls this same workflow
# with a version, then publishes what it built (see there).
on:
  push:
    branches: [zerospadesx]
  pull_request:
    branches: [zerospadesx]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release version (v0.3.0): signs the Quest APK with the release key"
        type: string
        required: false
        default: ""

jobs:
  guard:
    name: Guard (no AosBot, no singleplayer)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ZeroSpadesX ships without the private AosBot and the singleplayer modes
      # built on it; this keeps them from coming back in a merge or a rebase.
      - name: Check
        run: |
          if [ -e Sources/AosBot ]; then
            echo "::error::Sources/AosBot exists"
            exit 1
          fi
          if git grep -niI -E 'aosbot|LocalGamePanel|LocalServer|singleplayer' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::AosBot or singleplayer code found (above)"
            exit 1
          fi

  build-windows-x86:
    name: Build (Windows x86)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Cache vcpkg and dependencies
        uses: actions/cache@v6
        with:
          path: |
            vcpkg/installed
            vcpkg/buildtrees
          key: windows-x86-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: |
            windows-x86-

      - name: Bootstrap vcpkg
        run: vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure CMake
        run: |
          cmake -S . -B "${{ runner.workspace }}\zerospades.mk" `
            -A Win32 `
            -D CMAKE_BUILD_TYPE=Release `
            -D CMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -D VCPKG_TARGET_TRIPLET=x86-windows-static `
            -D CMAKE_CXX_STANDARD=17

      - name: Build application
        run: cmake --build "${{ runner.workspace }}\zerospades.mk" --config Release --parallel 8

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ZeroSpadesX-windows-x86
          path: |
            ${{ runner.workspace }}\zerospades.mk\bin\Release
            !${{ runner.workspace }}\**\*.lib
            !${{ runner.workspace }}\**\*.exp
            !${{ runner.workspace }}\**\*.pdb
          if-no-files-found: error

  build-windows-x64:
    name: Build (Windows x64, Vulkan + OpenXR) and test
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Cache vcpkg and dependencies
        uses: actions/cache@v6
        with:
          path: |
            vcpkg/installed
            vcpkg/buildtrees
          key: windows-x64-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: |
            windows-x64-

      - name: Bootstrap vcpkg
        run: vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure CMake
        run: |
          cmake -S . -B "${{ runner.workspace }}\zerospades.mk" `
            -A x64 `
            -D CMAKE_BUILD_TYPE=Release `
            -D CMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -D VCPKG_TARGET_TRIPLET=x64-windows-static `
            -D CMAKE_CXX_STANDARD=17 | Tee-Object configure.log
          if (-not (Select-String -Quiet -Path configure.log -Pattern 'OpenXR VR: ENABLED')) {
            Write-Error 'The Windows x64 build must have VR (OpenXR VR: ENABLED)'
          }

      - name: Build application
        run: cmake --build "${{ runner.workspace }}\zerospades.mk" --config Release --parallel 8

      - name: Test
        run: |
          cmake --build "${{ runner.workspace }}\zerospades.mk" --config Release --target zs_tests --parallel 8
          ctest --test-dir "${{ runner.workspace }}\zerospades.mk" -C Release --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ZeroSpadesX-windows-x64
          path: |
            ${{ runner.workspace }}\zerospades.mk\bin\Release
            !${{ runner.workspace }}\**\*.lib
            !${{ runner.workspace }}\**\*.exp
            !${{ runner.workspace }}\**\*.pdb
          if-no-files-found: error

  # The Macs have no OpenXR runtime, so no VR; they must still draw other
  # players' VR (vr_presence), which the vr_puppet_pose test checks there.
  build-macos:
    name: Build (macOS ${{ matrix.name }}, no VR) and test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            triplet: x64-osx
            arch: x86_64
            artifact: ZeroSpadesX-macos-intel
          - name: Apple Silicon
            runner: macos-15
            triplet: arm64-osx
            arch: arm64
            artifact: ZeroSpadesX-macos-arm64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache vcpkg and dependencies
        uses: actions/cache@v6
        with:
          path: |
            vcpkg/installed
            vcpkg/buildtrees
          key: macos-${{ matrix.arch }}-osx12-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: |
            macos-${{ matrix.arch }}-osx12-

      - name: Bootstrap vcpkg
        run: vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure CMake
        run: |
          cmake -S . -B "${{ runner.workspace }}/zerospades.mk" \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -D VCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -D VCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/cmake/triplets" \
            -D CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -D CMAKE_CXX_STANDARD=17 | tee configure.log
          grep -q 'OpenXR VR: DISABLED' configure.log || { echo "::error::expected no OpenXR on macOS"; exit 1; }

      - name: Build application
        run: cmake --build "${{ runner.workspace }}/zerospades.mk" --config Release --parallel 8

      - name: Test
        run: |
          cmake --build "${{ runner.workspace }}/zerospades.mk" --config Release --target zs_tests --parallel 8
          ctest --test-dir "${{ runner.workspace }}/zerospades.mk" -C Release --output-on-failure

      - name: Sign application bundle
        run: codesign --force --deep --sign - ${{ runner.workspace }}/zerospades.mk/bin/ZeroSpades.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.workspace }}/zerospades.mk/bin
          if-no-files-found: error

  build-linux-nix:
    name: Build (Linux + Nix)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build Nix flake
        run: nix build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ZeroSpadesX-linux-nix
          path: result/
          if-no-files-found: error

  build-linux-x64:
    name: Build (Linux x64, Vulkan + OpenXR) and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libsdl2-dev \
            libsdl2-image-dev \
            libglew-dev \
            libfreetype6-dev \
            libcurl4-openssl-dev \
            libogg-dev \
            libopus-dev \
            libopusfile-dev \
            zlib1g-dev \
            libopenxr-dev \
            libjsoncpp-dev \
            wget

      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y \
            vulkan-sdk

      - name: Build application
        run: |
          cmake -S . -B build \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_CXX_STANDARD=17 | tee configure.log
          grep -q 'OpenXR VR: ENABLED' configure.log || { echo "::error::the Linux x64 build must have VR"; exit 1; }
          cmake --build build --parallel $(nproc)

      - name: Test
        run: |
          cmake --build build --target zs_tests --parallel $(nproc)
          ctest --test-dir build --output-on-failure

      # vr_presence.py against a real piqueserver, and its byte format against
      # the client's encoder
      - name: Set up Python for the server tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test vr_presence.py
        run: |
          python -m pip install --upgrade pip
          python -m pip install piqueserver
          python Server/test/test_vr_presence.py -v

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ZeroSpadesX-linux-x64
          path: build/bin/
          if-no-files-found: error

  # Builds what a standalone headset's ARM CPU runs, without the APK: anything
  # not portable to ARM Linux (x86-only code, desktop GL) fails here.
  build-linux-arm64:
    name: Check (Linux arm64, Vulkan + OpenXR, no OpenGL)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # Ubuntu's own packages: LunarG's Vulkan SDK repository is x86 only.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libsdl2-dev \
            libsdl2-image-dev \
            libfreetype6-dev \
            libcurl4-openssl-dev \
            libogg-dev \
            libopus-dev \
            libopusfile-dev \
            zlib1g-dev \
            libvulkan-dev \
            glslang-tools \
            libopenxr-dev \
            libjsoncpp-dev

      - name: Build application
        run: |
          cmake -S . -B build \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_CXX_STANDARD=17 \
            -D USE_OPENGL=OFF
          cmake --build build --parallel $(nproc)

  # The Quest 3 APK: libmain.so and the paks for arm64 Android, packaged by
  # android/build-apk.sh. A release (release.yml, with a version) signs it with
  # the key every earlier Quest build was signed with, so headsets update in
  # place; anything else signs with a throwaway key, for testing only.
  build-android:
    name: Build (Quest 3 APK)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # The shaders and paks are made on this machine, with its own tools;
      # vcpkg would build the tools for the phone.
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The NDK pinned, not the runner's newest: NDK 30's libc++ stopped bringing
      # in <cstdlib>, and OpenAL Soft's bundled fmt no longer built with it.
      - name: Install Android build-tools, platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Cache vcpkg and dependencies
        uses: actions/cache@v6
        with:
          path: |
            vcpkg/installed
            vcpkg/buildtrees
            vcpkg/downloads
          key: android-arm64-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: |
            android-arm64-

      - name: Bootstrap vcpkg
        run: vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure CMake
        run: |
          cmake -S . -B "${{ runner.workspace }}/zerospades-android" -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -D VCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -D VCPKG_TARGET_TRIPLET=arm64-android \
            -D ANDROID_ABI=arm64-v8a \
            -D ANDROID_PLATFORM=android-29 \
            -D GLSLANG_VALIDATOR=/usr/bin/glslangValidator \
            -D CMAKE_CXX_STANDARD=17

      - name: Build libmain.so and the paks
        run: cmake --build "${{ runner.workspace }}/zerospades-android" --target ZeroSpades ZeroSpades_Resources --parallel 4

      # SDL's Java activity comes from the SDL source vcpkg built from: from
      # its downloads, or fetched again for the same release when they were
      # restored from the cache without it.
      - name: Find the SDL source
        run: |
          sdl="$(ls vcpkg/downloads/libsdl-org-SDL-release-2*.tar.gz 2>/dev/null | head -n 1)"
          if [ -z "$sdl" ]; then
            ver="$(python3 -c 'import json; print(json.load(open("vcpkg/ports/sdl2/vcpkg.json"))["version"])')"
            sdl="$RUNNER_TEMP/SDL-release-$ver.tar.gz"
            curl -fsSL -o "$sdl" "https://github.com/libsdl-org/SDL/archive/refs/tags/release-$ver.tar.gz"
          fi
          echo "SDL_SOURCE=$sdl" >> "$GITHUB_ENV"

      - name: Package the APK
        env:
          VERSION: ${{ inputs.version }}
          KEYSTORE_B64: ${{ inputs.version != '' && secrets.ANDROID_KEYSTORE_B64 || '' }}
          ANDROID_KEYSTORE_PASS: ${{ inputs.version != '' && secrets.ANDROID_KEYSTORE_PASS || '' }}
          ANDROID_KEY_ALIAS: ${{ inputs.version != '' && secrets.ANDROID_KEY_ALIAS || '' }}
        run: |
          if [ -n "$VERSION" ]; then
            if [ -z "$KEYSTORE_B64" ]; then
              echo "::error::a release APK needs the ANDROID_KEYSTORE_B64 secret"
              exit 1
            fi
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE"
          fi
          version_args=()
          [ -n "$VERSION" ] && version_args=(--version "$VERSION" --release)
          android/build-apk.sh \
            --libs "${{ runner.workspace }}/zerospades-android" \
            --paks "${{ runner.workspace }}/zerospades-android/Resources" \
            --sdl-source "$SDL_SOURCE" \
            --out "$RUNNER_TEMP/ZeroSpadesX-quest3.apk" \
            "${version_args[@]}"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ZeroSpadesX-quest3-apk
          path: ${{ runner.temp }}/ZeroSpadesX-quest3.apk
          if-no-files-found: error
